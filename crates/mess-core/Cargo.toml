[package]
name = "mess-core"
version = "0.0.0"
edition = "2024"
description = "mess v1: shared types and semantics used across the workspace"

[dependencies]
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
bincode = "1.3"
ciborium = "0.2"
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
