[package]
name = "mess-log-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mess-log]
path = ".."

# The fuzz crate is deliberately its own workspace (see `[workspace]` below):
# cargo-fuzz recompiles with `-Z sanitizer=address` and nightly-only libFuzzer
# flags that must not leak into the main workspace's stable build, and
# `cargo test`/`cargo clippy --workspace` at the repo root must never need to
# resolve libfuzzer-sys. Same reasoning as every other cargo-fuzz project.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_scanner"
path = "fuzz_targets/fuzz_scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_batch_decode"
path = "fuzz_targets/fuzz_batch_decode.rs"
test = false
doc = false
bench = false

# Not a fuzz target — a one-shot corpus-seed generator (`cargo run --bin
# gen_corpus`), kept in-crate so the seeds are generated by the same encoder
# the rest of the suite golden-tests against, rather than hand-copied hex.
# See fuzz_targets/gen_corpus.rs.
[[bin]]
name = "gen_corpus"
path = "fuzz_targets/gen_corpus.rs"
test = false
doc = false
bench = false
