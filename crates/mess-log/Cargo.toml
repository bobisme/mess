[package]
name = "mess-log"
edition = "2024"
version = "0.1.0"
description = "mess append-only batch log (D1/D2): commit-authority acceptance kernel + formal protocol model"

[dependencies]
thiserror = { workspace = true }
crc32c = "0.6"
# bn-1d0: the fold-chain hash (docs/spec/05-fold-certificates.md §3). BLAKE3
# (256-bit) is the spec's chosen hash for genesis / frame_hash / chain_step.
blake3 = "1"
# bn-36y: `fallocate(2)`/`FALLOC_FL_KEEP_SIZE` for segment preallocation and
# `ENOSPC` classification. Unix-only; the crate already targets Unix (`std::os::unix`).
libc = "0.2"
# The direct owner keeps the common small-event shape entirely inline while
# dropping attacker-sized spill storage after each batch.
smallvec = "1.15"

[dev-dependencies]
stateright = "0.31"
# bn-36y: the ENOSPC injection tests assert on `libc::ENOSPC`.
libc = "0.2"
# bn-cxr: the SIGKILL harness's real-fs scratch dirs go through the shared
# self-sweeping temp-dir helper instead of a hand-rolled, never-swept
# `$HOME/.cache/mess-sigkill-scratch`.
mess-testkit = { workspace = true }
# bn-1gx: loom drives the memory-ordering interleaving models in
# `src/loom_tests.rs`. Only used when built with `--cfg loom` (`just loom`);
# the module is `#[cfg(all(loom, test))]`, so a normal `cargo test` never
# touches it. Left as an ordinary dev-dep (not `[target.'cfg(loom)']`) because
# cargo does not reliably evaluate a bare `--cfg loom` from RUSTFLAGS in a
# `[target.'cfg(...)']` table — the standard loom setup.
loom = "0.7"

# `#[cfg(kani)]` proof modules (bn-y0b) are compiled only by the `cargo-kani`
# driver, which sets this cfg itself; it is never a real Cargo feature.
# Registering it here keeps `--all-targets -D warnings` clean under normal
# rustc/clippy, which otherwise flag it as an unexpected cfg (Rust 1.80+
# `unexpected_cfgs` lint).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(loom)"] }
