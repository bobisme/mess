[package]
name = "mess-store"
version = "0.0.0"
edition = "2024"
description = "mess v1: EventStore API surface"

[features]
# bn-20b engine swap: the composed `mess-log` + `mess-index` engine
# (`engine::LogEngine`) is the production default backend and is always
# compiled. The interim in-memory `MockBackend` is demoted to this
# feature — kept on by default only because the differential + facade-retry
# harnesses (`differential_model`, `cache`) exercise the facade against it.
# Production consumers can `--no-default-features` to drop it entirely; no
# path pulls in the pre-v1 `mess_db` crate.
default = ["mock"]
mock = []

[dependencies]
mess-core = { workspace = true }
# bn-20b: the composed production backend is built on the log (durability,
# ordering, recovery, sealing) ...
mess-log = { workspace = true }
# bn-20b: the active/sealed pointer index the composed engine reads through.
# bn-fj34: `mess-index` no longer carries a key-value store dependency either —
# snapshot discovery is `pack_snapshot`'s self-describing sidecar, built out of
# std alone, so nothing under `mess-store` pulls in a second storage engine.
mess-index = { workspace = true }
quick_cache = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# bn-cxr/bn-2jr: the shared self-sweeping temp-dir helper — every real-fs
# scratch dir across this crate's test suites and benches (previously
# `tempfile::tempdir()`/hand-rolled `$HOME/.cache/mess-test-tmp` joins) now
# goes through this one namespace so leaked dirs get swept.
mess-testkit = { workspace = true }

[[bench]]
name = "engine_envelope"
harness = false
