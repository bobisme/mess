[package]
name = "mess-cli"
version = "0.0.0"
edition = "2024"
description = "mess v1: the operational CLI (doctor, inspect, verify, rebuild-index, retention explain)"

[lib]
name = "mess_cli"
path = "src/lib.rs"

[[bin]]
name = "mess"
path = "src/main.rs"

[dependencies]
mess-log = { workspace = true }
mess-index = { workspace = true }
mess-store = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
# bn-2di: `mess migrate registry` opens the real engine (whose Backend seam is
# async) to fold $registry out of the log and write the canonical import.
tokio = { workspace = true }

[dev-dependencies]
mess-core = { workspace = true }
# bn-cxr/bn-2jr: the shared self-sweeping temp-dir helper (replaces
# hand-rolled `tempfile::tempdir()` call sites across this crate's tests).
mess-testkit = { workspace = true }
tokio = { workspace = true }
