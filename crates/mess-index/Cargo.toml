[package]
name = "mess-index"
version = "0.0.0"
edition = "2024"
description = "mess v1: metadata and pointer index"

[dependencies]
# bn-1ku: exact-KV metadata tables (stream/snapshot heads, projection
# checkpoints, recent-dedupe window) live on fjall — a pure-Rust LSM the
# ptr_index spike selected. Journal-buffered durability is sufficient because
# every table is rebuildable from the log (I5); see src/meta/mod.rs.
fjall = "3.1.6"
mess-log = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
# bn-20e: crc32c over the sealed sidecar's content (same crate/algorithm as
# mess-log's batch/footer CRCs, so the whole store speaks one checksum).
crc32c = "0.6"
# bn-1hx: bounded-bytes LRU of decoded pointer blocks for sealed stream replay
# (the sealed read paths' decompressed-block cache). Already a workspace dep;
# the sealed reader parallelizes with std scoped threads, no rayon. The `stats`
# feature exposes the hit/miss counters the cache-hit-rate metric reports.
quick_cache = { workspace = true, features = ["stats"] }
# bn-1i7: seal-time BinaryFuse16 membership filters over a segment's stream
# ids (round-3 spike pick: 0.002% FPR, 3.61 B/key, ~4ns query, zero false
# negatives). Default features only (`binary-fuse`, `uniform-random`); see
# `sealed::filter`.
xorf = "0.12"
# bn-1bn: zstd for the columnar sealed-tier codec (round-4 default: columnar /
# 128-event blocks / zstd-9 / no dicts = 30.8 B/event). Whole-block and
# per-column framing both live in `src/columnar`. Builds here only with the
# system clang (mise.toml pins CLANG_PATH for zstd-sys bindgen).
# `experimental` exposes the frame-format parameter (magicless zstd framing)
# the row-fallback dictionary tier uses (bn-zge / D6): a magic-stripped frame
# per row block saves the 4-byte magic on the rare fallback tier.
zstd = { version = "0.13", features = ["experimental"] }
# bn-2za: Reed-Solomon parity for the seal-time `.par` sidecar + offline
# `verify --repair`. MDS-optimal erasure coding, deterministic, O(n log n)
# SIMD encode/decode (fast at our 4 KiB-shard sizes). Pinned; license
# "MIT AND BSD-3-Clause".
reed-solomon-simd = "=3.1.0"

# bn-20e: `#[cfg(kani)]` ptr-block round-trip proofs are compiled only by
# `cargo kani`; teach the normal `cargo` build the cfg so it is not flagged
# (`unexpected_cfgs`), mirroring mess-log. `kani_slow` (bn-fyo) is the
# escape hatch documented in `sealed::ptr_block::kani_proofs`'s module doc
# for a future harness that genuinely cannot be bounded into a few minutes
# — registered here even though nothing uses it today so the convention is
# ready without another Cargo.toml edit.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(kani_slow)"] }

[dev-dependencies]
mess-log = { workspace = true }
# bn-cxr/bn-2jr: the shared self-sweeping temp-dir helper for the fjall
# round-trip / crash-lag / sealed-driver real-fs scratch dirs (replaces
# hand-rolled `tempfile::tempdir()` call sites).
mess-testkit = { workspace = true }
# bn-1bn: the columnar codec's byte-exact corpus mirrors the perf_compress
# spike's — real rmp-serde named-mode payloads (the actual Phase-1 bytes) and a
# Zipf stream/field workload — so the reassembly proof runs against the same
# shapes the sealer will see. Test-only.
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
rand = "0.10"
rand_distr = "0.6"
