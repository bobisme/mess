[package]
name = "social"
version = "0.1.0"
edition = "2024"
workspace = "../../"

[lib]
name = "social"
path = "src/lib.rs"

[dependencies]
mess-core = { workspace = true }
mess-derive = { workspace = true }
mess-store = { workspace = true }
# bn-gt5: the crate's `Id` newtype wraps `uuid::Uuid` (v7, time-ordered),
# rendered as 26-char lowercase Crockford base32 — see `src/id.rs`. Replaces
# the `ident` crate (bn-3c6's `Id: Ord` need is met by `Uuid`'s own `Ord`
# instead).
uuid = { workspace = true }
# The `#[derive(Event)]` expansion emits `#[derive(::serde::Serialize)]` /
# `Deserialize` wrapper structs for each variant's payload, so any crate
# using the derive needs `serde` as a direct dependency.
serde = { version = "1.0.188", features = ["derive"] }
# `Id`'s parse error (`id.rs`) is a `thiserror::Error` typed rejection,
# matching the domain error convention the rest of this crate already uses.
thiserror = { workspace = true }
# rmp-serde: msgpack codec for the projection checkpoint sidecar. Chosen over
# adding serde_json/bincode because it is the *same* codec `#[derive(Event)]`
# already uses for event payloads (mess-core depends on rmp-serde), so the
# checkpoint reuses the workspace's established serialization strategy rather
# than introducing a second one. Compact and self-describing enough that a
# truncated file reliably fails to decode (the corrupt-checkpoint rebuild path).
rmp-serde = "1"
tokio = { workspace = true }
# --- web layer (bn-13l) ---
# axum: the HTTP router/extractor layer. `default-features` kept (macros, form,
# tokio, http1) — no tls/multipart/ws needed. Small, hyper-based, no framework.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "form",
    "query",
] }
# maud: compile-time HTML templating. Chosen over askama (needs a build step +
# separate template files) and hand-rolled `format!` (no escaping, no
# structure): maud is a single proc-macro dependency, escapes by default, and
# keeps markup type-checked next to the handler. The `axum` feature makes
# `Markup` an `IntoResponse`.
maud = { version = "0.27", default-features = false, features = ["axum"] }
# --- seed corpus generator (bn-1mw) ---
# A small, seedable PRNG for the deterministic demo corpus. `std_rng` (the
# default feature) picks ChaCha12 — good enough determinism-within-a-build for
# a demo generator; not used for anything security-sensitive. 0.9, not 0.8:
# 0.9 renamed `Rng::gen`/`gen_range` to `random`/`random_range` specifically
# because `gen` became a reserved keyword in edition 2024 (this workspace's
# edition) — 0.8's `Rng::gen` would need `r#gen` escaping everywhere.
rand = { version = "0.9", default-features = false, features = [
    "std",
    "std_rng",
] }

[[bin]]
name = "social-web"
path = "src/bin/social-web.rs"

[[bin]]
name = "social-seed"
path = "src/bin/social-seed.rs"

[dev-dependencies]
mess-testkit = { workspace = true }
# tower's `ServiceExt::oneshot` drives the router in handler tests without a
# live socket; http-body-util collects response bodies to assert on HTML.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
