# The repo root .cargo/config.toml injects `-Clink-arg=-fuse-ld=lld`, but lld is
# not installed on this machine. Config rustflags arrays are merged across config
# files (cannot be removed here), so run with the env var, which takes precedence:
#
#   RUSTFLAGS="-Ctarget-cpu=native" cargo run --release
#
[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/clang"
