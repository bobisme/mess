[package]
name = "codec_bakeoff"
version = "0.1.0"
edition = "2024"

# Standalone spike: opt out of the repo's root workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
rmp-serde = "1"
postcard = { version = "1", features = ["use-std"] }
bincode = "1.3"
zstd = "0.13"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
