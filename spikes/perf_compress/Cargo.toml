[package]
name = "perf_compress"
version = "0.1.0"
edition = "2024"

# Standalone spike: opt out of the repo's root workspace.
[workspace]

[dependencies]
zstd = "0.13"
lz4_flex = "0.13"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rand_distr = "0.6"
crc32fast = "1"
lru = "0.12"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
