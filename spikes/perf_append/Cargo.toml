[package]
name = "perf_append"
version = "0.1.0"
edition = "2024"

# Standalone spike: opt out of the repo's root workspace.
[workspace]

[dependencies]
crc32fast = "1"
crc32c = "0.6"
crossbeam-channel = "0.5"
fjall = "3"
rocksdb = { version = "0.21", features = ["zstd"] } # baseline reproduction (same pin as mess_db)
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
rand = "0.10"
rand_distr = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
lto = "thin"
debug = true # symbols for perf record/report
