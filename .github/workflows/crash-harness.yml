name: crash-harness

# bn-3jg: the full 12k-case randomized crash-recovery loop
# (crates/mess-log/tests/crash_harness.rs). The fast ~1.5k-case profile
# (`randomized_crash_recovery_loop`) runs in the ordinary `cargo test` gate
# on every PR; this lane runs the `#[ignore]`d full profile
# (`randomized_crash_recovery_loop_full`, 12k+ cases) on a nightly schedule,
# alongside the sanitizer lanes (sanitizers.yml), so the heavier sweep does
# not sit on the per-PR critical path.
#
# The harness is fully deterministic and in-memory (SimRuntime + the sim
# fault fs), so it needs no real device, no threads, and no `-Z build-std`:
# a plain nightly `cargo test -- --ignored` reproduces every case, and a
# failure prints the offending seed for a one-line local repro
# (`cargo test -p mess-log --test crash_harness -- --exact <name>` after
# pinning the seed).

on:
  schedule:
    # 04:23 UTC daily — off-peak, staggered off the sanitizer lane (03:17).
    - cron: "23 4 * * *"
  workflow_dispatch: {}
  # Also run when the harness or the log crate's durability/recovery code
  # changes, so a regression is caught at merge rather than the next night.
  pull_request:
    paths:
      - "crates/mess-log/**"
      - ".github/workflows/crash-harness.yml"

concurrency:
  group: crash-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: crash-harness

      - name: full 12k-case crash-recovery loop
        run: |
          cargo test -p mess-log --test crash_harness \
            randomized_crash_recovery_loop_full -- --ignored --nocapture
