[workspace]
resolver = "2"
# Naming (bn-2gq): legacy pre-v1 crates keep their underscore names
# (mess_db, mess_ecs) to avoid churning every `use` path in code that
# dies once Phase 3 retires them. New v1 crates use dashes (mess-log,
# mess-core, mess-index, mess-store, mess-derive, mess-testkit), matching
# the crates.io convention. Stay consistent with whichever bucket a new
# crate belongs to.
members = [
  "crates/mess",
  "crates/mess-cli",
  "crates/mess_ecs",
  "crates/mess_db",
  "crates/mess-log",
  "crates/mess-core",
  "crates/mess-index",
  "crates/mess-store",
  "crates/mess-derive",
  "crates/mess-testkit",
  "crates/mess-bench",
  "crates/mess-soak",
  "examples/bank",
  "examples/social",
  "xtask",
]

# The bn-13s formal model runs an exhaustive state-space search as a cargo
# test; optimize just those packages so the check stays fast in CI.
[profile.dev.package.stateright]
opt-level = 2
[profile.dev.package.mess-log]
opt-level = 2
[profile.test.package.mess-log]
opt-level = 2

[workspace.dependencies]
mess = { path = "crates/mess" }
mess_db = { path = "crates/mess_db" }
mess_ecs = { path = "crates/mess_ecs" }
mess-log = { path = "crates/mess-log" }
mess-core = { path = "crates/mess-core" }
mess-index = { path = "crates/mess-index" }
mess-store = { path = "crates/mess-store" }
mess-derive = { path = "crates/mess-derive" }
mess-testkit = { path = "crates/mess-testkit" }
mess-bench = { path = "crates/mess-bench" }
#
ident = { git = "https://github.com/bobisme/ident" }
konst = "0.4.3"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
quick_cache = "0.7.0"
smallvec = "1.15.2"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
# bn-gt5: examples/social's Id newtype over Uuid (v7, time-ordered). Only
# `v7` is enabled here at the workspace level; `std`/`rng` etc. stay default.
uuid = { version = "1", features = ["v7"] }
# dev
assert2 = "0.4.0"
rstest = "0.26.1"
