[package]
name = "mess"
version = "0.0.1-placeholder"
edition = "2021"
authors = ["Bob <bob@standardinput.co>"]
description = "placeholder for a prototype message storage lib"
repository = "https://github.com/bobisme/mess"
homepage = "https://github.com/bobisme/mess"
documentation = "https://github.com/bobisme/mess"
readme = "README.md"

[features]
xtest = []
proptest = []

[workspace]
members = [".", "mess_ecs", "mess_db", "mess_log", "examples/social", "xtask"]

# The bn-13s formal model runs an exhaustive state-space search as a cargo
# test; optimize just those packages so the check stays fast in CI.
[profile.dev.package.stateright]
opt-level = 2
[profile.dev.package.mess_log]
opt-level = 2
[profile.test.package.mess_log]
opt-level = 2

[lib]
name = "mess"

[dependencies]
mess_db = { workspace = true }
mess_ecs = { workspace = true }

[workspace.dependencies]
mess = { path = "." }
mess_db = { path = "mess_db" }
mess_ecs = { path = "mess_ecs" }
mess_log = { path = "mess_log" }
#
ident = { git = "https://github.com/bobisme/ident" }
konst = "0.3.6"
parking_lot = { version = "0.12.1", features = ["arc_lock"] }
quick_cache = "0.4.0"
thiserror = "1.0.44"
tokio = { version = "1.32", features = ["full"] }
tokio-util = "0.7.8"
tracing = "0.1.37"
# dev
assert2 = "0.3.11"
rstest = "0.18.2"
