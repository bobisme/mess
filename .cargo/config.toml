[alias]
xtask = "run --package xtask --"

[env]
# rocksdb 8.x (via mess_db -> rocksdb 0.21) predates the GCC 13 header
# cleanup and fails with "'uint64_t' has not been declared" on modern
# GCC; force the include until the rocksdb crate is bumped or mess_db
# is retired for the v1 engine. Harmless for other C++ deps.
CXXFLAGS = "-include cstdint"

# No [target.*] linker override here on purpose: a fresh clone must build
# with whatever default linker the platform's `cc` picks, without clang or
# lld installed. If you have clang+lld available locally and want faster
# links, add the block below to your *personal, untracked* cargo config
# (e.g. ~/.cargo/config.toml, or a gitignored .cargo/config.toml.local
# merged in via `CARGO_HOME`/extra `--config` flags) rather than checking
# it into this repo:
#
#   [target.x86_64-unknown-linux-gnu]
#   linker = "/usr/bin/clang"
#   rustflags = [
#     "-Ctarget-cpu=native",
#     "-Clink-arg=-fuse-ld=lld",
#     "-Clink-arg=-Wl,--no-rosegment",
#   ]
